name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out Jeff 6.7.0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: johanthoren/jeff
          ref: 62047fb4ab8b425a3db222c8db614f377d1e5b64
          path: pinned-jeff
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Rust toolchain
        run: rustup show

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Demonstrate jeffd
        run: node scripts/demo.mjs ${{ github.workspace }}/pinned-jeff/src/cli/cook.js
